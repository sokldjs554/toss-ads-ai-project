    document.getElementById('tracerun').textContent = D.evals.trace_run_id || D.evals.run_id;
    document.getElementById('tracedate').textContent = D.evals.trace_date || '';
    document.getElementById('evaldate').textContent = D.evals.eval_date || '';
    document.getElementById('traceround').textContent = D.evals.trace_round || '';
    document.getElementById('evalround').textContent = D.evals.eval_round || '';
    document.getElementById('strip').innerHTML =
      '<div><dt>문제 있는 광고 통과</dt><dd class="num">' + frac(r.unsafe) + ' <small>수정·게재 제한이 필요한 광고를 통과시킨 수</small></dd></div>' +
      '<div><dt>문제없는 광고에 수정 요청</dt><dd class="num">' + frac(r.false_flag) + ' <small>1차 5/14 (라벨 수정 전 14건) · 같은 13건 기준 1차 4/13</small></dd></div>' +
      '<div><dt>보정 오차 ECE</dt><dd class="num">' + r.ece.toFixed(2) + ' <small>1차 0.14</small></dd></div>' +
      '<div><dt>레드팀 돌파</dt><dd class="num">' + t.evaded + '/' + t.n + ' <small>공격 변형 중 승인된 수</small></dd></div>';
  })();

  /* ───────── 탭 ───────── */
  var TABS = [['replay', '시나리오 재생'], ['evals', '평가 5회 비교'], ['fm', '실패 모드'], ['arch', '구조']];
  function renderTabs() {
    document.getElementById('tabs').innerHTML = TABS.map(function (t) {
      return '<button class="tab" role="tab" data-a="tab" data-v="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('');
  }

  /* ───────── 재생 ───────── */
  function renderReplay() {
    var sc = D.scenarios[state.sc];
    return '<div class="scn-grid">' + D.scenarios.map(function (s, i) {
      return '<button class="scn' + (i === state.sc ? ' on' : '') + '" data-a="sc" data-i="' + i + '"><b>' + esc(s.label) + '</b><span>' + esc(s.blurb) + '</span><span class="dots">' +
        (s.variants.length ? s.variants.map(function (v) { return pill(v.final); }).join('') : '<span class="pill bad">중단</span>') + '</span></button>';
    }).join('') + '</div>' + scBody(sc);
  }

  function zwCount(s) { var m = s.match(/[​-‏⁠﻿­ㅤ⠀]/g); return m ? m.length : 0; }

  function scBody(sc) {
    var I = sc.intercept, rm = (I.removed || []).map(function (q) { return { q: q, c: 'm-cut', t: '가로채서 제거한 구절' }; });
    var zw = zwCount(sc.input.description);
    var h = '';
    h += '<section class="sec"><h2><span class="n">입력</span>광고주가 넣은 것</h2><div class="grid2">' +
      '<div class="card"><div class="lbl">자연어 요청</div><p class="q">' + mark(sc.input.advertiser_input, rm) + '</p></div>' +
      '<div class="card"><div class="lbl">상품 · 업종(광고주 선언) · 사실 목록</div><p><b>' + esc(sc.input.product) + '</b> <span class="chip">' + esc(sc.input.category) + '</span></p>' +
      '<ul class="plain" style="margin-top:6px">' + sc.input.facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div></div>' +
      '<details><summary>상품 설명 (신뢰할 수 없는 자유 텍스트)' + (zw ? ' · 보이지 않는 문자 ' + zw + '개 포함' : '') + '</summary><pre class="box">' + mark(sc.input.description, rm) + '</pre></details>' +
      (sc.input.landing ? '<details><summary>랜딩 페이지 텍스트 (소재와 일치하는지 대조하는 기준)</summary><pre class="box">' + esc(sc.input.landing) + '</pre></details>' : '') + '</section>';

    /* 0 intercept */
    h += '<section class="sec"><h2><span class="n">0</span>Safety Intercept ' + (I.triggered ? (I.hard_block ? '<span class="chip bad">중단</span>' : '<span class="chip warn">가로챔</span>') : '<span class="chip ok">통과</span>') + '</h2>';
    if (!I.triggered) {
      h += '<p class="lead">요청에서 정책 위반 의도나 인젝션이 보이지 않아 그대로 넘겼습니다.</p>';
    } else {
      var kind = { policy_intent: '정책 위반 의도', injection: '프롬프트 인젝션', prohibited_category: '금지 업종·표현' }[I.kind] || I.kind;
      h += '<div class="callout ' + (I.hard_block ? 'bad' : 'warn') + '"><b>' + kind + '.</b> ' + esc(I.message || (I.kind === 'injection' ? '상품 설명 속 지시문을 문장째 제거하고, 나머지는 데이터로만 모델에 전달했습니다.' : '')) +
        (I.message_by_llm ? ' <span class="muted">(안내문은 모델이 쓰고, 제안문은 가드레일을 다시 통과한 것만 씁니다)</span>' : '') + '</div>';
      if (I.suggested) h += '<div class="grid2"><div class="card"><div class="lbl">원문 요청</div><p class="q">' + mark(sc.input.advertiser_input, rm) + '</p></div><div class="card"><div class="lbl">준수 방향으로 고쳐 진행한 요청</div><p class="q">' + esc(I.suggested) + '</p></div></div>';
      if (I.hard_block) h += '<p class="lead">이후 단계(플래너, 카피, 심사)는 실행하지 않았습니다. 모델 호출 0회, 비용 $0.</p>';
      h += findingsTable(I.findings);
    }
    h += '</section>';
    if (sc.trace.halted && !sc.variants.length) return h + obsSection(sc);

    /* 1 planner */
    var P = sc.planner && sc.planner.plan;
    if (P) {
      h += '<section class="sec"><h2><span class="n">1</span>플래너 <span class="chip">GPT-4o · Structured Outputs</span> ' + (sc.planner.repaired ? '<span class="chip warn">코드가 수리</span>' : '<span class="chip ok">플랫폼 제약 통과</span>') + '</h2>' +
        '<p class="lead">목표 <b>' + esc(P.objective) + '</b> · KPI ' + esc(P.kpi) + ' · 총 예산 ' + Number(P.total_budget_krw).toLocaleString() + '원. 모델의 출력은 목표별 허용 입찰 방식, 예산 합, 타겟 제약으로 코드가 다시 검증합니다.</p>' +
        '<div class="card" style="margin-top:12px"><div class="lbl">생각 과정</div><p>' + esc(P.planner_reasoning) + '</p></div>' +
        '<div class="scroll"><table><thead><tr><th>광고 세트</th><th>타겟</th><th>지면</th><th class="r">예산(원)</th><th>입찰</th></tr></thead><tbody>' +
        P.ad_sets.map(function (a) { return '<tr><td>' + esc(a.name) + '</td><td>' + esc(a.audience) + '</td><td>' + esc(a.placement) + '</td><td class="r num">' + Number(a.budget_krw).toLocaleString() + '</td><td>' + esc(a.bid_strategy) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="grid2"><div class="card"><div class="lbl">가정</div><ul class="plain">' + ((P.assumptions || []).length ? P.assumptions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') : '<li class="muted">모델이 적은 가정 없음</li>') + '</ul></div>' +
        '<div class="card"><div class="lbl">심사에서 걸릴 수 있는 지점</div><ul class="plain">' + (P.risks || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div></section>';
    }

    /* variants */
    var fin = sc.variants.map(function (v) { return v.final; });
    var cnt = function (k) { return fin.filter(function (x) { return x === k; }).length; };
    h += '<section class="sec"><h2><span class="n">2–6</span>소재별 사전점검 ' + fin.map(pill).join(' ') + '</h2>' +
      '<p class="lead">카피 생성(Claude 자리, 키가 하나라 GPT-4o) → 결정론 가드레일 → 가상 유저 패널 → 심사 모델 → 경계 사례 교차 검증 → 코드가 최종 판정. 점검 통과 ' + cnt('APPROVE') + ' · 수정 필요 ' + cnt('REVISE') + ' · 게재 불가 ' + cnt('REJECT') + ' · 담당자 확인 필요 ' + cnt('HUMAN_REVIEW') + '. (이 프로젝트의 검사 기준에 따른 결과이며 실제 플랫폼 심사가 아닙니다.)</p>';
    sc.variants.forEach(function (v, i) { h += variantCard(sc, v, i); });
    h += '</section>' + obsSection(sc);
    return h;
  }

  function findingsTable(fs) {
    if (!fs || !fs.length) return '';
    return '<div class="scroll"><table><thead><tr><th>규칙</th><th>심각도</th><th>인용</th><th>설명</th></tr></thead><tbody>' + fs.map(function (f) {
      return '<tr><td><span class="mono">' + esc(f.rule_id) + '</span><div class="muted" style="font-size:12px">' + esc(ruleTitle(f.rule_id)) + '</div></td><td>' + sev(f.severity) + '</td><td>' + esc(f.quote || '—') + '</td><td>' + esc(f.explanation) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function adCard(c, quotes, tone) {
    return '<div class="ad"><div class="tone">' + esc(tone || c.tone || '') + '</div><div class="h">' + mark(c.headline, quotes) + '</div><div class="b">' + mark(c.body, quotes) + '</div><span class="c">' + esc(c.cta) + '</span>' +
      (c.disclosures && c.disclosures.length ? '<div class="d">' + c.disclosures.map(function (d) { return '<div>· ' + mark(d, quotes) + '</div>'; }).join('') + '</div>' : '') + '</div>';
  }

  var STATUS = {
    kept: ['채택', 'ok', '원문에서 인용을 확인했고 카탈로그의 규칙이라 채택'],
    unverified: ['원문에 없는 근거', 'bad', '원문에 없는 내용을 근거로 제시 → 근거에서 제외하고 확신 상한 0.6 (FM-04)'],
    overruled: ['코드가 반증', 'bad', '코드가 충족으로 확인한 고지·근거·구조 계층을 모델이 위반이라 함 → 버림 (FM-23)'],
    duplicate: ['중복', 'hold', '결정론 가드레일이 이미 찾은 것'],
    unknown: ['없는 규칙', 'bad', '카탈로그에 없는 규칙 ID → 버림 (FM-03)']
  };

  function variantCard(sc, v, i) {
    var key = sc.key + ':' + i, tab = state.vtab[key] || 'why';
    var quotes = [];
    v.det.findings.forEach(function (f) { if (f.quote) quotes.push({ q: f.quote, c: 'm-' + f.severity, t: f.rule_id }); });
    if (v.review) v.review.findings.forEach(function (f) { if (f.status === 'kept' && f.quote) quotes.push({ q: f.quote, c: 'm-' + f.severity, t: f.rule_id }); });
    var tabs = [['why', '확인이 필요한 이유'], ['chk', '검사 항목'], ['aud', '가상 사용자 반응'], ['fix', '수정 제안']];
    var h = '<article class="vcard"><div class="vhead"><div class="t"><h3>변형 ' + (i + 1) + '</h3><span class="mono muted">' + esc(v.id) + '</span><span class="chip">' + esc(v.copy.tone || '') + '</span></div>' + badge(v.final) + '</div>' +
      '<div class="vreason"><b>판정 근거</b> · ' + esc(v.reason) + '</div><div class="vbody"><div class="vleft">' + adCard(v.copy, quotes) +
      '<div class="sh">소재의 주장 → 근거(fact id)</div>' + (v.copy.claims.length ? '<ul class="plain">' + v.copy.claims.map(function (c) { return '<li>' + esc(c.text) + ' <span class="mono ' + (c.fact_id ? 'muted' : '') + '">' + (c.fact_id ? '→ ' + esc(c.fact_id) : '근거 없음') + '</span></li>'; }).join('') + '</ul>' : '<p class="muted">주장 없음</p>') + '</div>' +
      '<div class="vright"><div class="itabs" role="tablist">' + tabs.map(function (t) { return '<button class="itab" role="tab" data-a="vtab" data-k="' + key + '" data-v="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>';
    if (tab === 'why') h += whyPane(v);
    else if (tab === 'chk') h += v.det.checklist.map(function (c) { return '<div class="chk"><span class="s ' + (c.passed ? 'p' : 'f') + '">' + (c.passed ? '통과' : '걸림') + '</span><span><b>' + esc(c.name) + '</b> <span class="muted">· ' + esc(c.detail) + '</span></span></div>'; }).join('');
    else if (tab === 'aud') h += audPane(v.audience);
    else h += fixPane(v);
    return h + '</div></div></article>';
  }

  function whyPane(v) {
    var h = '<div class="sh">결정론 가드레일 (코드) · ' + DEC[v.det.decision][0] + '</div>';
    if (!v.det.findings.length) h += '<p class="muted">걸린 규칙 없음</p>';
    v.det.findings.forEach(function (f) {
      h += '<div class="fi"><div class="row">' + sev(f.severity) + '<b class="mono">' + esc(f.rule_id) + '</b><span>' + esc(ruleTitle(f.rule_id)) + '</span></div>' +
        (f.quote ? '<div class="x">인용 “' + esc(f.quote) + '”</div>' : '') + '<div class="x">' + esc(f.explanation) + '</div><div class="src">출처 · ' + esc(ruleSrc(f.rule_id)) + '</div></div>';
    });
    var R = v.review;
    if (R) {
      h += '<div class="sh">심사 모델 · ' + esc(R.model) + ' · 판정 ' + R.model_decision + ' · 신뢰도 ' + Number(R.model_confidence).toFixed(2) + (R.confidence < R.model_confidence ? ' → 상한 ' + Number(R.confidence).toFixed(2) : '') + '</div>';
      if (R.rationale) h += '<p class="sub">' + esc(R.rationale) + '</p>';
      R.findings.forEach(function (f) {
        var s = STATUS[f.status];
        h += '<div class="fi"><div class="row"><span class="pill ' + s[1] + '">' + s[0] + '</span><b class="mono">' + esc(f.rule_id) + '</b><span>' + esc(ruleTitle(f.rule_id)) + '</span></div>' +
          '<div class="x">인용 “' + esc(f.quote) + '”</div><div class="x">' + esc(f.explanation) + '</div><div class="src">' + esc(s[2]) + '</div></div>';
      });
      if (!R.findings.length) h += '<p class="muted">모델이 낸 finding 없음</p>';
      if (R.unsupported) h += '<p class="src" style="margin-top:6px">모델이 수정을 제안했지만 근거로 남은 finding 이 없어 자동 판정하지 않습니다.</p>';
    }
    if (v.second) h += '<div class="sh">교차 검증</div><p>2차 의견 ' + pill(v.second.decision) + ' 신뢰도 ' + Number(v.second.confidence).toFixed(2) + ' · ' + (v.second.disagreement ? '판정 불일치' : '판정 일치') + ' · ' + (v.second.independent ? '다른 모델 계열' : '<span class="chip warn">같은 제공자라 독립성 없음</span>') + '</p>';
    return h;
  }

  function audPane(a) {
    if (!a) return '<p class="muted">패널 단계가 꺼져 있거나 실패했습니다.</p>';
    return '<dl class="kpis"><div><dt>끌림</dt><dd class="num">' + a.mean_appeal + '</dd></div><div><dt>신뢰</dt><dd class="num">' + a.mean_trust + '</dd></div><div><dt>클릭 의향</dt><dd class="num">' + pct(a.click_rate, 0) + '</dd></div><div><dt>관점 분산</dt><dd class="num">' + a.diversity + '</dd></div></dl>' +
      (a.sycophancy === 'True' || a.sycophancy === true ? '<p class="callout warn">패널이 거의 같은 말을 했습니다. 정보량이 낮아 참고용으로만 씁니다 (FM-15).</p>' : '') +
      a.feedbacks.map(function (f) {
        return '<div class="persona"><div class="nm">' + esc(f.name) + '</div><div class="sc">끌림 ' + f.appeal + ' · 신뢰 ' + f.trust + ' · 이해 ' + f.clarity + ' · ' + (f.click ? '클릭 O' : '클릭 X') + '</div><div>“' + esc(f.quote) + '”</div><div class="muted" style="font-size:12.5px">걱정 · ' + esc(f.concern) + '</div></div>';
      }).join('') + (a.summary ? '<p class="sub" style="margin-top:8px">' + esc(a.summary) + '</p>' : '');
  }

  function fixPane(v) {
    var R = v.review, h = '';
    if (v.rewrite_shown) {
      return '<p class="sub">검토 모델의 수정 제안 중 같은 검사 기준으로 다시 검사해 통과한 것만 보여 줍니다.</p>' + adCard({ headline: R.rewrite.headline, body: R.rewrite.body, cta: R.rewrite.cta, disclosures: R.rewrite.disclosures }, [], '수정안');
    }
    if (R && R.rewrite) {
      var why = v.final !== 'REVISE' ? '최종 판정이 ' + DEC[v.final][0] + '이라 자동 수정안을 제시하지 않습니다.' : '재검사를 통과하지 못해 폐기했습니다 (FM-19).';
      h += '<p class="sub">' + why + '</p><details><summary>모델이 제안했지만 채택하지 않은 수정안</summary>' + adCard({ headline: R.rewrite.headline, body: R.rewrite.body, cta: R.rewrite.cta, disclosures: R.rewrite.disclosures }, [], '미채택') + '</details>';
      return h;
    }
    return '<p class="muted">수정이 필요하지 않습니다.</p>';
  }

  function obsSection(sc) {
    var T = sc.trace, i = state.span[sc.key] == null ? firstLlm(sc) : state.span[sc.key], total = Math.max(T.duration_ms, 1);
    var h = '<section class="sec"><h2><span class="n">관측</span>이 실행의 트레이스</h2><div class="wfhead"><span>총 시간 <b class="num">' + ms(T.duration_ms) + '</b></span><span>스팬 <b class="num">' + sc.spans.length + '</b></span><span>모델 호출 <b class="num">' + T.llm_calls + '</b>회</span><span>토큰 <b class="num">' + T.tokens_in.toLocaleString() + ' → ' + T.tokens_out.toLocaleString() + '</b></span><span>비용 <b class="num">$' + T.cost_usd.toFixed(3) + '</b></span><span class="mono muted">' + esc(T.id) + '</span></div>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>단계</span><span><i style="background:var(--violet)"></i>모델 호출</span><span><i style="background:var(--amber)"></i>가드레일</span><span><i style="background:var(--warn)"></i>가로챔·fallback</span></div><div class="wf">';
    sc.spans.forEach(function (s, k) {
      h += '<button class="wf-row' + (k === i ? ' on' : '') + '" data-a="span" data-s="' + sc.key + '" data-i="' + k + '"><span class="wf-label" style="padding-left:' + (s.depth * 12) + 'px" title="' + esc(s.name) + '">' + esc(s.name) + '</span><span class="wf-track"><span class="wf-bar k-' + s.kind + ' s-' + s.status + '" style="left:' + (s.off / total * 100).toFixed(2) + '%;width:' + Math.max(s.dur / total * 100, 0.7).toFixed(2) + '%"></span></span><span class="wf-ms">' + ms(s.dur) + '</span></button>';
    });
    h += '</div>';
    var s = sc.spans[i];
    if (s) {
