<h1>한결소프트는 이렇게 일합니다</h1>

<p>서울 본사와 부산 연구소에서 120명이 함께 일하고 있으며, 매년 새로운 팀원을 맞이합니다.</p>
<p>채용 문의는 인사팀으로 연락해 주세요. 협업 제안도 언제든 환영합니다.</p>
<p>주요 연혁: 2015년 설립, 2018년 부산 연구소 개소, 2022년 해외 법인 설립.</p>
