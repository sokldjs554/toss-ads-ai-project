<svg xmlns="http://www.w3.org/2000/svg" width="600" height="314" viewBox="0 0 600 314"><title>생활비 통장 광고</title><rect width="600" height="314" fill="#FFFFFF"/><text x="40" y="100" font-size="44" font-weight="700" fill="#191F28">월 3만원부터 시작하는 통장</text><text x="40" y="170" font-size="24" fill="#4E5968">자동이체로 편하게 모아 보세요</text><rect x="40" y="220" width="180" height="56" rx="12" fill="#2B5BD7"/><text x="130" y="256" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">지금 확인</text></svg>