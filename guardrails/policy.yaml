# 광고 심사 규칙 카탈로그
#
# 버전 이력 (규칙의 뜻이나 코드가 규칙을 읽는 방식이 바뀌면 올린다 — 평가 결과는 이 버전에 묶어서 비교한다)
#   2026.10.6  tight가 서로 다른 단어 내부 조각을 연결한 과탐 제외. 규칙·심각도는 유지, 이전 재검사 결과와 버전 분리.
#   2026.10.5  한국어·영어 지시 변경 표현 보강, 대화에서는 첫 공격부터 같은 턴 끝까지 격리.
#   2026.10.4  근거 결합(GRND-*) 비교 보강: 하이픈 범위·복합 금액(1만5천원)·전각/구어 단위·주기 수식어·연도·부정 표현·마감 표기·기준일/식별번호 제외.
#              규칙 목록과 문구는 2026.10.3 과 같다.
#   2026.10.3  GRND-NUM-01/CLAIM-01/COND-01/COND-02 제목 정리, 고지 문구 속 숫자·조건도 비교.
#
# 출처: 토스애즈 공개 광고주 가이드(공통 심사 정책 · 소재별 심사 정책 · 업종별 심사 정책 · 광고 불가 업종 안내)와
#       금융소비자보호법 제22조 · 대부업법 제9조 · 표시광고법의 공개 조문을 읽고 이 프로젝트가 '실행 가능한 규칙' 으로 재구성한 것.
#       실제 플랫폼의 심사 기준·내부 정책이 아니며 법률 자문도 아니다. section 은 가이드의 어느 항목을 보고 적었는지 표시한다.
#
# 필드
#   severity : block(반려) | fix(수정 후 재심사) | warn(주의, 승인 가능)
#   layer    : lexical(정규화 후 패턴) | disclosure(필수 고지) | grounding(근거) | injection | semantic(LLM 만 판단) | structural
#   applies  : 적용 업종. all 또는 ProductCategory 값 목록
#   patterns : 정규화된 표면(loose/tight)에 적용하는 정규식. 한글 조사·어미는 패턴 안에서 허용
#   negation_aware : true 면 매치 직후 부정 표현이 있으면 warn 으로 내리고 의미 심사로 넘긴다
#   exceptions : 이 정규식에 걸리는 매치는 무시 (예: 상품 자체의 금리 범위 '최저 연 4.5%')
version: "2026.10.6"
rules:
  # ───────────────────────────── 토스애즈 공통 · 소재별 ─────────────────────────────
  - id: TA-SUPERLATIVE-01
    title: 근거 없는 최상급·절대 표현
    section: "공통 심사 정책 › 허위/과장/기만 7 (최상급 표현은 객관적 증빙 제출 시에만)"
    severity: fix
    layer: lexical
    applies: [all]
    patterns:
      - "(업계|국내|시장|세계|대한민국|전국)\\s*(최저|최고|최대|최다|최초|1\\s*위|유일|넘버\\s*원|no\\.?\\s*1)"
      - "(?<![가-힣])(최저|최고|최대|최다)\\s*(금리|한도|혜택|조건|수익|보장|할인|가격|품질|성능)"
      - "(?<![가-힣])(1\\s*위|넘버\\s*원|no\\.?\\s*1|유일한?|독보적|완벽한?|100\\s*%)"
    exceptions:
      - "(최저|최고)\\s*(금리|이자|이율)?\\s*(연|월)?\\s*\\d"   # 상품 자체의 금리 범위 표기 (최저 연 4.5% ~ 최고 연 15%)
      - "최대\\s*(한도\\s*)?\\d"                   # 최대 한도 5,000만원 — 수치 있는 상품 조건 (근거는 grounding 이 본다)
    explanation: "비교 대상·근거가 없는 최상급 표현. 증빙 자료가 있으면 사용 가능하므로 반려가 아니라 수정 요청."
    fix_hint: "증빙 가능한 사실(숫자·조건)로 바꾸거나 삭제"

  - id: TA-URGENCY-01
    title: 허위 긴급성·기간 한정 암시
    section: "공통 심사 정책 › 허위/과장/기만 2 (특정 시점까지만 제공하는 것처럼 표기)"
    severity: fix
    layer: lexical
    applies: [all]
    patterns:
      - "지금\\s*아니면"
      - "오늘\\s*(만|까지|하루)"
      - "마감\\s*(임박|직전)"
      - "선착순"
      - "(곧|금방)\\s*(종료|마감|사라)"
      - "놓치면\\s*(후회|끝|손해)"
      - "(절판|마지막\\s*기회|이번이\\s*마지막)"
    explanation: "집행 기간 이후에도 제공되는 조건을 한정된 것처럼 보이게 하는 표현. 실제 종료일이 사실 목록에 있으면 그 날짜를 명시해야 한다."
    fix_hint: "실제 기간이 있으면 날짜를 명시, 없으면 삭제"

  - id: TA-OMISSION-01
    title: 혜택·할인의 조건 생략
    section: "공통 심사 정책 › 허위/과장/기만 3·6·11 (조건 미표기, 기준 상품 미표시)"
    severity: fix
    layer: semantic
    applies: [all]
    patterns: []
    explanation: "캐시백·할인·무료 등 혜택을 말하면서 적용 조건(대상·기간·한도·기준 상품)을 보여 주지 않는 경우."
    fix_hint: "조건을 같은 소재 안에 읽을 수 있는 크기로 표기"

  - id: TA-COMPARE-01
    title: 타사 비교·비방
    section: "공통 심사 정책 › 비교/비방 1~3"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(타사|타\\s*은행|타\\s*카드사|경쟁사|다른\\s*(앱|은행|회사|서비스|플랫폼))\\s*(보다|대비|와\\s*달리|과\\s*달리|는\\s*다르)"
      - "[A-Z가-힣]{1,6}(사|은행|카드|페이|뱅크)\\s*보다\\s*(저렴|싸|낮|높|좋|빠)"
    explanation: "비교 대상·기준이 명시되지 않은 우위 표현, 또는 타사 비방으로 의심되는 표현."
    fix_hint: "자사 상품의 사실만 서술"

  - id: TA-ENDORSE-01
    title: 추천·보증 콘텐츠의 이해관계 미표시
    section: "공통 심사 정책 › 비교/비방 4 (추천·보증 심사지침)"
    severity: warn
    layer: lexical
    applies: [all]
    patterns:
      - "(실제|진짜)\\s*(후기|리뷰|사용기)"
      - "(인플루언서|유튜버|전문가|의사|약사|변호사)\\s*(추천|보증|인증|극찬)"
      - "(만족도|추천율)\\s*\\d+\\s*%"
      - "#?\\s*(sponsored|유료\\s*AD|partner|thanks\\s*to|collaboration)(?![가-힣a-z])"
    explanation: "경험적 사실 근거와 경제적 이해관계 표시가 필요한 추천·보증 표현. 광고 표시 문구가 함께 있어야 한다."
    fix_hint: "'광고' 표시와 이해관계를 명시하거나 삭제"

  - id: TA-SENSITIVE-01
    title: 민감정보·개인정보 추정 표현
    section: "소재별 심사 정책 › 문구 4 (건강·종교·정치 등 민감정보, 개인정보 추정 표현)"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(신용\\s*(점수|등급)|연체|연봉|소득|부채|빚)\\s*(이|가)?\\s*(낮|높|많|적|있|없)[가-힣]*\\s*(분|고객|회원|당신|님)"
      - "(회원님|고객님|당신)(의|이|께서)?\\s*(한도|신용|대출|보험료|점수)(가|이|는|을)?\\s*(올랐|나왔|조회|확인|승인)"
      - "(질병|암|당뇨|우울증|불면증|탈모|비만)\\s*(있으신|있는|겪는|앓는)\\s*(분|고객|회원)"
      - "(종교|정치\\s*성향|성적\\s*지향|장애)\\s*(가|이|를|에)?"
    explanation: "특정 이용자의 신용·건강·종교·정치 성향 등을 암시하거나 개인정보를 알고 있는 것처럼 보이는 표현."
    fix_hint: "불특정 다수를 향한 일반 서술로 변경"

  - id: TA-NOTICE-MIMIC-01
    title: 토스 공지·알림 오인 문장
    section: "소재별 심사 정책 › 문구 5-3, 공통 › 토스 서비스 보호 2 (알림 형태 오인)"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "\\[\\s*(토스|알림|안내|공지|긴급|필독|web발신)\\s*\\]"
      - "(입금|출금|송금|결제)\\s*(되었|됐)습니다"
      - "(본인\\s*확인|인증)\\s*(이|가)\\s*필요(합니다|해요)"
      - "(미확인|확인하지\\s*않은|미수령|수령하지\\s*않은)\\s*(혜택|포인트|머니|송금|알림)"
      - "토스\\s*(에서|가)\\s*(보낸|드리는)\\s*(알림|안내|공지)"
    explanation: "플랫폼 공지·시스템 알림처럼 보이게 구성한 문장. 유저가 광고임을 인지하지 못하게 한다."
    fix_hint: "광고주 명의의 일반 광고 문장으로 변경"

  - id: TA-BRAND-01
    title: 플랫폼 브랜드 무단 사용
    section: "공통 심사 정책 › 토스 서비스 보호 1·6 (사전 협의 필요)"
    severity: fix
    layer: lexical
    applies: [all]
    patterns:
      - "(토스|toss)\\s*(공식|제휴|인증|추천|선정|파트너)"
      - "(토스|toss)(와|과|에서)\\s*(함께|제공|보증)"
    explanation: "광고주가 플랫폼과 제휴·인증 관계인 것처럼 보이는 표현. 사전 협의 문구 없이는 사용 불가."
    fix_hint: "협의된 경우 지정 문구 기재, 아니면 삭제"

  - id: TA-SPECIAL-01
    title: 특수문자·이모지 과다
    section: "소재별 심사 정책 › 문구 5-2"
    severity: fix
    layer: lexical
    applies: [all]
    patterns:
      - "[!?]{2,}"
      - "[★☆♥♡♪♬◆◇■□▶▷●○◎※☞☜✔✓✨💰🔥🎉🎁❗❕‼]{2,}"
      - "([!?★☆♥♡◆■▶●※✔✨💰🔥🎉🎁❗‼])(?:\\s*\\1){2,}"
    explanation: "의미 전달에 불필요한 특수문자·이모지의 반복."
    fix_hint: "특수문자는 의미 전달에 필요한 1개 이내로"

  - id: TA-LANG-01
    title: 한글 표기 원칙 위반
    section: "소재별 심사 정책 › 문구 1-1·1-3 (한글 표기, 외래어 남용)"
    severity: fix
    layer: structural
    applies: [all]
    patterns: []
    explanation: "광고 문구의 한글 비율이 낮거나 영어 문장으로만 구성됨."
    fix_hint: "한글로 다시 쓰기 (브랜드명 등 고유명사는 예외)"

  - id: TA-LENGTH-01
    title: 글자 수 초과
    section: "소재별 심사 정책 › 문구 6 (띄어쓰기 포함 1자 계산) · 광고 상품별 소재 가이드"
    severity: fix
    layer: structural
    applies: [all]
    patterns: []
    explanation: "헤드라인·본문 길이가 지면 제한을 넘음 (프로젝트 기본값: 헤드라인 30자, 본문 90자, CTA 12자)."
    fix_hint: "지면 제한 안으로 줄이기"

  - id: TA-SLANG-01
    title: 비속어·반말·불쾌 표현
    section: "소재별 심사 정책 › 문구 2-2·2-5, 정보입력 양식 가이드 (평어체 불가)"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(?<![가-힣])(씨발|시발|존나|졸라|개같|병신|미친|꺼져|닥쳐|호구|빡치)"
      - "(해라|해봐|받아라|사라|써라|눌러라|가입해|신청해|클릭해)(?![가-힣])"
    explanation: "비속어·은어, 유저를 하대하는 평어체."
    fix_hint: "~해요체 또는 명사형으로"

  - id: TA-GAMBLING-01
    title: 사행심 조장
    section: "공통 심사 정책 › 보편적 사회정서 침해 4, 청소년 보호 7, 토스애즈 청소년 보호정책 6"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(대박|한\\s*방|인생\\s*역전|떼돈|일확천금|로또|잭팟|카지노|토토|바카라|슬롯|홀덤)"
      - "(무조건|100\\s*%|전원)\\s*(당첨|적중|수익)"
      - "(당첨|적중)\\s*(보장|확률\\s*100)"
      - "(베팅|배팅)\\s*(하|해|하세요|추천)"
    explanation: "도박·사행심을 조장하거나 요행으로 큰 이익을 얻는다는 인상을 주는 표현."
    fix_hint: "삭제. 경품 이벤트라면 조건·확률·기간을 명시"

  - id: TA-FEAR-01
    title: 불안·손실 공포 조성
    section: "소재별 심사 정책 › 문구 2-5 (부정적인 감정), 공통 › 폭력/혐오/공포 1"
    severity: fix
    layer: lexical
    applies: [all]
    patterns:
      - "(안\\s*하면|않으면|모르면)\\s*(손해|큰일|후회|망)"
      - "(지금\\s*)?(안\\s*보면|모르면)\\s*(나만\\s*)?(손해|호구)"
      - "(위험|큰일)\\s*(합니다|해요|납니다|나요)\\s*$"
    explanation: "행동하지 않으면 손해·위험하다는 공포 소구."
    fix_hint: "혜택의 사실만 서술"

  - id: TA-HEALTH-01
    title: 검증되지 않은 건강·효능 표현
    section: "공통 심사 정책 › 사회정서 6, 업종별 › 건강기능식품·의료 (질병 예방·치료 효능 오인 표현 금지)"
    severity: block
    layer: lexical
    applies: [health, ecommerce, app, other]
    patterns:
      - "(완치|치료|예방|근본\\s*치료|부작용\\s*(없|제로|0))"
      - "(살|체중|지방)\\s*(이|을)?\\s*\\d+\\s*(kg|킬로)\\s*(감량|빠)"
      - "(효과|효능)\\s*(보장|확실|100)"
      - "(암|당뇨|고혈압|치매|탈모|불면증)\\s*(에|을)?\\s*(좋|효과|도움|낫)"
    explanation: "질병의 예방·치료 효능, 확정적 효과를 암시하는 표현. 의료·건기식은 사전 심의 내용과 동일해야 한다."
    fix_hint: "심의받은 기능성 문구만 사용, '개인차가 있을 수 있음' 명시"

  - id: TA-RESTRICTED-01
    title: 광고 불가 업종·내용
    section: "광고 불가 업종 안내 (유사투자자문·미등록 가상자산·유사수신·P2P·대부업·다단계·도박·채권추심 등), 토스애즈 청소년 보호정책"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(리딩방|주식\\s*리딩|종목\\s*추천방|VIP\\s*방|비공개\\s*방|텔레그램\\s*방)"
      - "(유사수신|다단계|네트워크\\s*마케팅|피라미드|폰지)"
      - "(사설\\s*(토토|카지노|경마)|불법\\s*도박|도박\\s*사이트)"
      - "(채권\\s*추심|빚\\s*독촉\\s*대행|신용\\s*조사\\s*대행)"
      - "(P2P|피투피)\\s*(대출|투자)"
      - "(대부업체|사금융|일수|급전\\s*대출|무등록\\s*대출)"
      - "(성인\\s*(채팅|화상|용품)|애인\\s*대행|조건\\s*만남|랜덤\\s*채팅)"
    explanation: "플랫폼에서 집행할 수 없는 업종·행위. 입력 단계에서 바로 중단(hard block)."
    fix_hint: "집행 불가 — 다른 상품·업종으로만 가능"

  - id: TA-DUP-01
    title: 반려 소재의 유사 변형 재등록
    section: "공통 심사 정책 › 토스 서비스 보호 4-5, 광고주 어뷰징 행위 제한 정책 1·2"
    severity: block
    layer: structural
    applies: [all]
    patterns: []
