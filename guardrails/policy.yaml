    layer: disclosure
    applies: [savings]
    patterns: []
    explanation: "금리 기준 시점·변동 가능성, 우대 조건, 예금자보호 한도 안내."
    fix_hint: "고지 문구란에 추가"

  - id: FIN-DISCLOSE-EDU-01
    title: 부업·재테크 교육 필수 안내 누락
    section: "토스애즈 업종별 심사 정책 › 부업·재테크 온라인 교육 (필수 안내 문구, 원금·수익 보장 금지)"
    severity: fix
    layer: disclosure
    applies: [education]
    patterns: []
