    fix_hint: "필수 안내 문구 추가"

  - id: FIN-UNREGISTERED-01
    title: 미등록 금융 서비스 암시
    section: "토스애즈 업종별 심사 정책 › 금융 (금감원 미조회 서비스 불가, 대부업·다단계 불가) · 광고 불가 업종 5"
