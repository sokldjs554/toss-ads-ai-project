      - "(해외|역외)\\s*(선물|FX|마진)\\s*(거래|투자)\\s*(대행|계좌)"
      - "(개인|사채|지인)\\s*(돈|자금)\\s*(빌려|대출)\\s*드"
    explanation: "제도권 밖 금융 서비스로 보이는 표현."
    fix_hint: "집행 불가"

  - id: FIN-CRYPTO-01
    title: 가상자산 수익 유도
    section: "가상자산이용자보호법 · 토스애즈 광고 불가 업종 5 (미등록 가상자산) · 청소년 보호정책 10 (원금 손실 금융상품)"
    severity: block
