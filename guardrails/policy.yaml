    severity: fix
    layer: disclosure
    applies: [loan]
    patterns: []
    explanation: "대출 광고에는 이자율(범위), 연체이자율, 상환 방식·기간, 심사에 따른 조건 변동, 경고 문구가 있어야 한다."
    fix_hint: "고지 문구란에 필수 항목 추가"

  - id: FIN-DISCLOSE-INV-01
    title: 투자 광고 필수 고지 누락
