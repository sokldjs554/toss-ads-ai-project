    fix_hint: "반려 사유를 실제로 해소한 뒤 재심사 신청"

  - id: TA-LANDING-01
    title: 소재↔랜딩 페이지 표현 불일치
    section: "소재별 심사 정책 › 랜딩 페이지 콘텐츠 규정 1, 공통 › 유저의 사용성 보호 (혜택·랜딩 일치) — 플랫폼이 밝힌 1위 반려 사유"
    severity: fix
    layer: grounding
    applies: [all]
    patterns: []
    explanation: "소재의 숫자·혜택·조건이 랜딩 페이지 텍스트에서 확인되지 않음. 의미가 같아도 표현이 다르면 반려될 수 있다."
    fix_hint: "랜딩 페이지에 있는 표현·숫자 그대로 사용"

  - id: TA-AI-01
    title: AI 생성 가상 인물·전문가의 추천·보증
    section: "소재별 심사 정책 › AI를 활용한 광고 2 (가상의 전문가가 추천·보장)"
