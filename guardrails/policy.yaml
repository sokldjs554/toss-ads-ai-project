  # ───────────────────────────── 금융 (금소법 제22조 · 대부업법 제9조 · 표시광고법) ─────────────────────────────
  - id: FIN-GUARANTEE-01
    title: 원금 보장·손실 없음 표현
    section: "금융소비자보호법 제22조 제3항 (손실보전·이익보장 오인 표현 금지) · 광고 불가 업종 12 (유사수신·원금보장)"
    severity: block
    layer: lexical
    applies: [all]
    negation_aware: true
    patterns:
      - "원금\\s*(을|이|은)?\\s*(보장|보전|보호|지켜|안전)"
      - "(손실|손해|리스크|위험)\\s*(이|은|가|도)?\\s*(없|제로|0\\s*%|전혀\\s*없|걱정\\s*없|볼\\s*일\\s*없)"
      - "(잃을|손해\\s*볼)\\s*(걱정|염려|일)\\s*(없|제로|zero)"
      - "(무위험|무손실|노리스크|안전\\s*자산\\s*보장)"
    explanation: "투자·예치 상품에서 원금이 보장되거나 손실이 없다는 인상을 주는 표현. 예금자보호 한도 안내는 별도 고지로만 가능."
    fix_hint: "삭제 후 '원금 손실 가능성' 고지 추가"

  - id: FIN-RETURN-01
    title: 수익률 보장·확정 수익
    section: "금융소비자보호법 제22조 제3항 · 자본시장법 제55조 (손실보전·이익보장 금지)"
    severity: block
    layer: lexical
    applies: [all]
    negation_aware: true
    patterns:
      - "(수익|수익률|이익|이자|배당|성과)\\s*(을|이|은|를)?\\s*(보장|보증|확정|약속|장담)"
      - "(확정|보장|보증|고정)\\s*(수익|수익률|이익|배당)"
      - "(월|연|매달|매월|하루)\\s*\\d+(\\.\\d+)?\\s*%\\s*(수익|이익|확정|보장)"
      - "(무조건|반드시|100\\s*%)\\s*(수익|오른다|오릅니다|번다|법니다)"
    explanation: "미래 수익을 확정적으로 제시하는 표현."
    fix_hint: "과거 실적은 기간·기준을 명시하고 '미래 수익률을 보장하지 않습니다' 고지"

  - id: FIN-APPROVAL-01
    title: 무조건·무심사·누구나 승인
    section: "대부업법 제9조의2 (대부광고 금지 표현: 누구나·무조건·무심사 등 오인 표현) · 금소법 제22조 제3항 (대출 조건 오인)"
    severity: block
    layer: lexical
    applies: [loan, card, insurance, other, app]
    patterns:
      - "(누구나|무조건|무심사|심사\\s*없이|서류\\s*없이|신분증\\s*만|100\\s*%)\\s*([가-힣]{1,4}\\s*)?(승인|대출|가능|통과|발급|개설|OK)"
      - "(누구나\\s*무조건|무조건\\s*누구나|무조건\\s*무심사)"
      - "(신용\\s*불량|연체\\s*중|무직|소득\\s*없|신불자|회생|파산)[가-힣]*\\s*(도|이라도|여도)\\s*(가능|승인|대출|OK)"
      - "(승인률|승인율)\\s*(100|99)\\s*%"
      - "(거절|거부)\\s*(없|제로|0\\s*%|걱정\\s*없)"
    explanation: "심사 없이 또는 누구나 승인된다는 인상을 주는 표현. 대출은 심사 결과에 따라 거절될 수 있다."
    fix_hint: "'심사 결과에 따라 한도·금리가 달라지며 거절될 수 있음' 으로"

  - id: FIN-SPEED-01
    title: 즉시·당일 실행 단정
    section: "대부업법 제9조의2 (즉시 등 신속성으로 무심사를 암시하는 표현) · 토스애즈 공통 › 허위/과장 3"
    severity: fix
    layer: lexical
    applies: [loan, card]
    patterns:
      - "(즉시|당일|\\d+\\s*(분|초)|바로)\\s*(만에|안에|내에?)?\\s*(대출|입금|송금|실행|승인|발급|조회|완료)"
      - "(대출|입금|송금)\\s*(즉시|당일|바로)"
    exceptions:
      - "(영업일|심사\\s*(완료|통과|결과))"   # 조건이 함께 있으면 허용
    explanation: "실행 속도를 단정해 심사가 없다는 인상을 줌. 조건(심사 완료 후, 영업일 기준)을 함께 표기해야 한다."
    fix_hint: "'심사 완료 시 영업일 기준 당일 입금 가능' 처럼 조건 명시"

  - id: FIN-RATE-01
    title: 금리 오인 표기
    section: "금융소비자보호법 제22조 제3항 · 시행령 (이자율 범위 미표시, 최저만 강조) · 대부업법 제9조"
    severity: fix
    layer: lexical
    applies: [loan, card, savings]
    patterns:
      - "(?<![~\\-–])\\s*(연|월)?\\s*\\d+(\\.\\d+)?\\s*%\\s*(부터|~|대|의)?\\s*(금리|이자|이율)(?!\\s*(~|부터|에서))"
      - "(0\\s*%|제로)\\s*(금리|이자)"
      - "(금리|이자)\\s*(0\\s*%|제로|없음|무이자)"
    exceptions:
      - "\\d+(\\.\\d+)?\\s*%\\s*(~|부터|에서)\\s*(연|월)?\\s*\\d+(\\.\\d+)?\\s*%"   # 범위 표기면 통과
      - "(최저|최고)\\s*(연|월)\\s*\\d"                                           # 범위 서술
    explanation: "단일 금리(특히 최저)만 제시하거나 무이자처럼 보이게 함. 적용 범위·기준·조건을 함께 표기해야 한다."
    fix_hint: "'연 X.X% ~ Y.Y% (심사 결과에 따라 다름)' 형태로"

  - id: FIN-LIMIT-01
    title: 한도 단정 표기
    section: "금융소비자보호법 제22조 제3항 (한도 오인) · 토스애즈 공통 › 허위/과장 3 (조건 생략)"
    severity: fix
    layer: lexical
    applies: [loan]
    patterns:
      - "(한도|대출)\\s*(최대|최고)?\\s*\\d[\\d,\\.]*\\s*(억|만\\s*원|천만)"
      - "(최대|최고)\\s*한도\\s*\\d[\\d,\\.]*\\s*(억|만\\s*원|천만)"
    exception_scope: text   # 조건 문구가 소재 어디에든 있으면 통과
    exceptions:
      - "(심사|신용|조건|상품)\\s*(결과|에|별로)?\\s*(에\\s*)?(따라|다름|상이)"
    explanation: "최대 한도를 모든 유저가 받을 수 있는 것처럼 보이게 함."
    fix_hint: "'최대 X원 (심사 결과에 따라 다름)' 로 조건 병기"

  - id: FIN-DISCLOSE-LOAN-01
