  - id: FIN-ADVICE-01
    title: 종목 추천·수익 인증
    section: "자본시장법 (미등록 투자자문) · 토스애즈 광고 불가 업종 5 (유사투자자문)"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(종목|급등주|테마주|작전주)\\s*(추천|찍어|알려|공개)"
      - "(수익|수익률)\\s*(인증|자랑|공개)\\s*(샷|사진|내역)?"
      - "(따라\\s*사|따라\\s*매수|복사\\s*매매|카피\\s*트레이딩)"
    explanation: "특정 종목 매매를 권유하거나 수익 인증으로 가입을 유도하는 유사투자자문 표현."
    fix_hint: "집행 불가"

  - id: FIN-DAILY-01
    title: 일(日) 단위 비용 표시
    section: "금융소비자보호법 제22조 제4항 · 시행령 제20조 제1항 2호 (보험료·이자를 일 단위로 표시해 부담이 작아 보이게 하는 행위)"
    severity: fix
    layer: lexical
    applies: [loan, card, insurance, savings, investment]
    patterns:
      - "(하루|일|1일)\\s*(에\\s*)?(커피|담배|밥|점심)\\s*(한\\s*잔|값|한\\s*갑|한\\s*끼)"
      - "(하루|1일|일)\\s*(이자|보험료|비용|부담)\\s*\\d"
      - "(하루|1일)\\s*(단돈\\s*)?\\d[\\d,]*\\s*원"
    explanation: "비용을 하루 단위로 쪼개 작아 보이게 하는 표현. 월·연 단위 총비용으로 표시해야 한다."
    fix_hint: "월/연 단위와 총 비용으로 표기"

  - id: FIN-INS-UNLIMITED-01
    title: 보험 무제한·무조건 보장
    section: "금융소비자보호법 제22조 제4항 1호 (보장한도·면책·감액 누락으로 제한 없이 보장받는 것처럼 오인) · 금감원 온라인 보험광고 점검(2025)"
    severity: block
    layer: lexical
    applies: [insurance, all]
    patterns:
      - "(무제한|평생|무조건|묻지도\\s*따지지도)\\s*(보장|보상|지급)"
      - "(매년|매달|매월)\\s*\\d[\\d,]*\\s*(만\\s*원|억)\\s*(보상|지급|보장)"
      - "(진단|사고)\\s*(만\\s*)?(되면|나면|시)\\s*(무조건|즉시|바로)\\s*\\d[\\d,]*\\s*(만\\s*원|억)"
    explanation: "면책·감액·한도 없이 보장되는 것처럼 보이는 표현."
    fix_hint: "'약관상 지급 사유 해당 시 최대 X원(면책기간·감액 조건 적용)' 형태로"

  - id: FIN-REVOLVING-01
    title: 리볼빙을 최소결제·일부결제로 표현
    section: "금감원 리볼빙 광고 개선(2024.2): '최소결제·일부결제' 표현 금지, 리볼빙이 고금리 대출성 상품임을 명시"
    severity: block
    layer: lexical
    applies: [card]
    patterns:
      - "(최소\\s*결제|일부\\s*결제|일부만\\s*결제)\\s*(로|으로|하고|하면)?\\s*(부담\\s*없|편하|가볍)"
      - "리볼빙.{0,20}(부담\\s*없|편하게|가볍게)"
    explanation: "일부결제금액이월약정(리볼빙)을 가벼운 편의 기능처럼 보이게 하는 표현."
    fix_hint: "'리볼빙은 고금리 대출성 상품이며 수수료율 연 X~Y%' 명시"

  - id: LOAN-SLANG-01
    title: 불법 금융 은어
    section: "금융감독원 불법 대부광고 식별 기준 (급한불·지각비·내구제·카드깡·대리입금·통장매매)"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(급한\\s*불|지각비|내구제|카드\\s*깡|대리\\s*입금|통장\\s*(매매|매입|삽니다)|휴대폰\\s*(깡|내구제))"
    explanation: "불법 사금융에서 쓰는 은어. 광고주 적격 확인 전까지 집행 불가."
    fix_hint: "집행 불가"

  - id: FIN-GOV-01
    title: 정부·공공기관·제도권 사칭
    section: "대부업법 제9조의2 · 금융감독원 불법 대부광고 식별 기준 (정부지원·서민금융 사칭)"
    severity: block
    layer: lexical
    applies: [all]
    patterns:
      - "(정부|국가|공공기관|금융위|금감원|서민금융진흥원|한국은행)\\s*(지원|인증|보증|추천|승인|공식)\\s*(대출|상품|업체|자금)"
      - "(햇살론|사잇돌|새희망홀씨|버팀목)\\s*(보다|대신|급|수준|같은)"
    exceptions:
      - "(공식\\s*판매|취급\\s*기관|제도권)"
    explanation: "정부·공공기관의 지원·보증을 받는 것처럼 오인하게 하는 표현. 광고주 검증 전까지 집행 불가."
    fix_hint: "실제 취급 기관명으로, 정책 상품은 공식 명칭과 조건만"

  # ───────────────────────────── 입력 보호 · 근거 · 구조 ─────────────────────────────
  - id: INJ-INSTR-01
    title: 프롬프트 인젝션 — 지시문 삽입
    section: "프로젝트 규칙 (입력 신뢰 경계). 상품 설명·요청문은 데이터이지 지시가 아니다"
    severity: block
    layer: injection
    applies: [all]
    patterns:
      - "(이전|위의?|앞의?|기존)\\s*(모든\\s*)?(지시(?:사항)?|명령|규칙|지침|프롬프트)(을|를|은|는)?\\s*(?:(?:모두|전부|다|완전히)\\s*)?(무시|잊|해제|취소|폐기)"
      - "\\b(ignore|disregard|forget)\\s+(?:all\\s+)?(?:the\\s+)?(?:(?:previous|prior|above|earlier)\\s+(?:instructions?|rules?|prompts?|guidelines?)|(?:instructions?|rules?|prompts?|guidelines?)\\s+(?:above|before|earlier))\\b"
      - "(system\\s*prompt|시스템\\s*프롬프트)(을|를)?\\s*(출력|보여|공개|무시|변경|reveal|print|show)"
      - "you\\s+are\\s+now\\s+|(이제|지금)부터\\s*(너는|당신은|넌)\\s*"
      - "(개발자|관리자|운영자)\\s*모드|developer\\s*mode|jailbreak|DAN\\s*mode"
    explanation: "모델에게 역할·규칙 변경을 지시하는 문장이 데이터 입력에 섞여 있음."
    fix_hint: "해당 문장을 제거하고 데이터로만 처리"

  - id: INJ-APPROVE-01
    title: 프롬프트 인젝션 — 심사 조작
    section: "프로젝트 규칙 (심사 조작 시도). 토스애즈 공통 › 광고 금지 4 (성과·심사 부정 조작) 의 취지"
    severity: block
    layer: injection
    applies: [all]
    patterns:
      - "(APPROVE|승인)\\s*(으로|로)\\s*(판정|처리|응답|출력)"
      - "(심사|검수|리뷰)\\s*(를|을)?\\s*(통과|승인)\\s*(시켜|해\\s*줘|처리|하라|하세요|할\\s*것)"
      - "(이|본|해당)\\s*(광고|소재)(는|은)\\s*(이미|사전)\\s*(승인|검수\\s*완료|심의\\s*통과)"
      - "(반려|거절)\\s*(하지\\s*마|금지|불가)"
      - "(findings?|위반\\s*사항)(을|를|은|는)?\\s*(비워|빈\\s*배열|없다고|empty)"
      - "\\byou\\s+(?:must|should|will)\\s+(?:now\\s+)?approve\\s+(?:this|the)\\s+(?:ad|advertisement)\\b"
    explanation: "심사 모델의 판정을 직접 지정하려는 문장."
    fix_hint: "해당 문장을 제거하고 소재를 HUMAN_REVIEW 로"

  - id: GRND-NUM-01
    title: 상품 정보에 없는 숫자
    section: "프로젝트 규칙 (근거 결합) · 토스애즈 공통 › 허위/과장 1·2 · 랜딩 불일치"
    severity: fix
    layer: grounding
    applies: [all]
    patterns: []
    explanation: "소재의 숫자(%, 원, 명, 배, 일)가 광고주 사실 목록과 랜딩 텍스트 어디에도 없음."
    fix_hint: "사실 목록에 있는 숫자만 사용하거나 사실을 추가"

  - id: GRND-CLAIM-01
    title: 상품 정보에서 근거를 찾을 수 없는 주장
    section: "프로젝트 규칙 (모든 주장은 사실 id 를 가리키고, 그 사실이 주장을 실제로 뒷받침해야 한다)"
    severity: fix
    layer: grounding
    applies: [all]
    patterns: []
    explanation: "생성 모델이 fact_id 를 비워 둔 주장, 존재하지 않는 fact_id 를 가리키는 주장, 또는 가리킨 사실의 수치·어휘가 주장과 맞지 않는 경우 (예: '배송 15일' 사실로 '5% 할인' 을 근거 삼음)."
    fix_hint: "주장을 실제로 뒷받침하는 사실을 가리키거나, 사실 목록에 근거를 추가하거나, 주장을 삭제"

  - id: GRND-COND-01
    title: 상품 정보의 조건이 빠짐
    section: "프로젝트 규칙 (근거 결합) · 공통 심사 정책 › 허위/과장/기만 3·6 (조건 미표기)"
    severity: fix
    layer: grounding
    applies: [all]
    patterns: []
    explanation: "광고가 근거로 쓴 사실에 '~후 자동결제', '심사 결과에 따라', '~원 이상', '~까지', '1인 1회', '제외' 같은 조건이 있는데 광고 문구·고지 어디에도 그 조건이 없음. 코드가 보는 조건 표식은 이 여섯 종류뿐이다."
    fix_hint: "조건을 같은 소재 안에 표기 (예: '7일 무료 체험 후 월 19,900원 자동결제')"

  - id: GRND-COND-02
    title: 상품 정보와 다른 조건
    section: "프로젝트 규칙 (근거 결합) · 공통 심사 정책 › 허위/과장/기만 3·6 (조건 변경·반대 표기)"
    severity: fix
    layer: grounding
    applies: [all]
    patterns: []
    explanation: "광고가 같은 종류의 조건을 말하는데 값이 사실과 다르거나(50,000원 이상 ↔ 5,000원 이상, 10월 31일까지 ↔ 11월 30일까지, 1인 1회 ↔ 1인 3회) 뜻이 반대(자동결제 있음 ↔ 자동결제 없음, 이상 ↔ 이하, 심사 결과에 따라 ↔ 무심사)임. 코드가 값·뜻을 비교하는 조건은 자동결제·심사·최소 금액·기간 한정·1인 횟수·제외 여섯 종류뿐이다."
    fix_hint: "사실 목록의 조건 그대로 표기 (예: '50,000원 이상 구매 시', '7일 무료 체험 후 월 19,900원 자동결제')"

  - id: CAT-MISMATCH-01
    title: 선언 업종과 문구 단서 불일치
    section: "토스애즈 공통 › 광고 심사 6 (광고주 입력 정보와 실제 일치 여부) · 업종별 심사 정책"
    severity: warn
    layer: structural
    applies: [all]
    patterns: []
    explanation: "'app/other' 로 등록했지만 대출·금리·수익률 등 금융 단서가 있어 금융 규칙이 함께 적용됨."
    fix_hint: "업종을 실제에 맞게 등록"

# ───────────────────────────── 업종별 필수 고지 체크리스트 ─────────────────────────────
# 각 항목: 소재 본문 또는 고지 문구에서 any_of 정규식 중 하나라도 보이면 충족. canonical 은 수정안에 넣을 기본 문장.
disclosures:
  loan:
    rule: FIN-DISCLOSE-LOAN-01
    items:
      - key: rate_range
        label: 이자율(범위)
        any_of: ["\\d+(\\.\\d+)?\\s*%\\s*(~|부터|에서)\\s*(연|월)?\\s*\\d+(\\.\\d+)?\\s*%", "(최저|최고)\\s*(연|월)\\s*\\d", "금리.{0,12}(심사|신용).{0,6}(따라|다름)"]
        canonical: "금리·한도는 심사 결과에 따라 다르며, 적용 금리 범위는 상품 설명서를 확인하세요."
      - key: overdue_rate
        label: 연체이자율
        any_of: ["연체\\s*(이자율|이율|금리|시)"]
        canonical: "연체 시 약정 금리에 연체 가산 이자율이 적용됩니다."
      - key: repayment
        label: 상환 방식·기간
        any_of: ["상환\\s*(방식|기간|조건)", "(만기|원리금|원금균등|분할)\\s*(일시|균등|상환)"]
        canonical: "상환 방식·기간은 상품 설명서를 참고하세요."
      - key: warning
        label: 경고 문구
        any_of: ["과도한\\s*(빚|대출|채무)", "큰\\s*불행", "(신용\\s*(점수|등급)|개인\\s*신용\\s*평점)\\s*(가|이)?\\s*(하락|낮아질)"]
        canonical: "상환 능력에 비해 대출금이 과도할 경우 개인신용평점이 하락할 수 있습니다."
      - key: read_terms
        label: 설명서·약관 확인 권유
        any_of: ["(설명서|약관).{0,12}(읽어|확인|참조|참고)"]
        canonical: "계약 체결 전 상품 설명서와 약관을 반드시 읽어 보시기 바랍니다."
      - key: review_no
        label: 준법감시인 심의필
        any_of: ["심의\\s*(필|번호)", "준법\\s*감시인", "심사\\s*필"]
        canonical: "준법감시인 심의필 제0000-000호 (광고주가 실제 번호로 교체)"
  investment:
    rule: FIN-DISCLOSE-INV-01
    items:
      - key: principal_loss
        label: 원금 손실 가능성
        any_of: ["원금\\s*손실", "손실\\s*(이|가)?\\s*(발생|날)\\s*수"]
        canonical: "투자에는 원금 손실 가능성이 있습니다."
      - key: past_performance
        label: 과거 실적 ≠ 미래 수익
        any_of: ["과거\\s*(수익률|실적|운용).{0,20}(미래|보장하지)", "미래\\s*(수익|수익률)(을|를)?\\s*보장하지"]
        canonical: "과거 수익률이 미래 수익률을 보장하지 않습니다."
      - key: no_deposit_insurance
        label: 예금자보호 미적용 안내
        any_of: ["예금자\\s*보호.{0,10}(않|되지\\s*않|아닙|제외)"]
        canonical: "금융투자상품은 예금자보호법에 따라 보호되지 않습니다."
      - key: read_terms
        label: 설명서·약관 확인 권유
        any_of: ["(설명서|약관|투자설명서).{0,12}(읽어|확인|참조|참고)"]
        canonical: "투자 전 투자설명서와 약관을 반드시 읽어 보시기 바랍니다."
  crypto:
    rule: FIN-DISCLOSE-INV-01
    items:
      - key: principal_loss
        label: 원금 손실 가능성
        any_of: ["원금\\s*손실", "가격\\s*변동", "손실\\s*(이|가)?\\s*(발생|날)\\s*수"]
        canonical: "가상자산은 가격 변동성이 크며 원금 손실 가능성이 있습니다."
  card:
    rule: FIN-DISCLOSE-LOAN-01
    items:
      - key: card_warning
        label: 카드 경고 문구
        any_of: ["(사용액|이용\\s*금액).{0,12}과도.{0,20}(신용\\s*평점|신용\\s*점수|신용\\s*등급)", "개인\\s*신용\\s*평점.{0,6}하락"]
        canonical: "상환 능력에 비해 신용카드 사용액이 과도할 경우 귀하의 개인신용평점이 하락할 수 있습니다."
      - key: fee
        label: 연회비·조건 안내
        any_of: ["연회비", "(전월|전\\s*월)\\s*실적", "(조건|기준).{0,8}(상세|참조|확인)"]
