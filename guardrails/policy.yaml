      - "(전문가|의사|약사|변호사|세무사)\\s*(가|이)\\s*(보장|보증|장담)"
    explanation: "실제 인물·사실이 아님을 안내하지 않은 AI 생성 보증, 또는 전문가 보증 표현."
    fix_hint: "AI 활용 사실을 고지하거나 보증 표현 삭제"

  - id: TA-DISCLOSURE-SLOT-01
    title: 고지 문구란에 광고 문구 입력
