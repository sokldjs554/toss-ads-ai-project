name: ci
on:
  push:
  pull_request:
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Install browser for persistent-queue transaction tests
        run: python -m playwright install --with-deps chromium
      - name: unit tests (no network)
        run: python -m pytest -o addopts='' -q -ra
      - name: regression gate — deterministic layer vs committed baseline
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: python -m evals.run --dataset golden --no-llm --gate
      - name: adversarial regression set (harvested by red team) — deterministic layer must approve none
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: python -m evals.run --dataset adversarial --no-llm --require-zero-unsafe
      - name: regression gate — demo-mode pipeline (mock reviewer) vs committed baseline
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: python -m evals.run --dataset golden --gate
      - name: holdout (final-check set, not used for tuning) — deterministic layer must approve none
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: python -m evals.run --dataset holdout --no-llm --require-zero-unsafe
      - name: G-069 contrast cases — deterministic layer must approve none
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: python -m evals.run --dataset contrast_g069 --no-llm --require-zero-unsafe
      - name: number/condition comparison cases (wrong + normal contrast) — deterministic layer must approve none of the wrong ones
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: python -m evals.run --dataset conditions --no-llm --require-zero-unsafe && python -m evals.run --dataset conditions_extra --no-llm --require-zero-unsafe
      - name: new-feature evaluations on synthetic data (no network, no model) — safety counts must stay zero
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: |
          python -m evals.dialogs --split all --gate
          python -m evals.url_ingest_eval --gate
          python -m evals.image_eval --gate
          python -m evals.insights_eval --gate --regression
          python -m evals.quality_signals --gate
      - name: original conversation evidence (historical contract, report only)
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: python -m evals.dialogs --dataset evals/datasets/dialogs.jsonl --split all
      - name: app smoke (import + headless start)
        env:
          PREFLIGHT_FORCE_DEMO: "1"
        run: |
          python -c "import app"  # 모듈 임포트가 되어야 한다
          timeout 25 streamlit run app.py --server.headless true --server.port 8599 > /tmp/st.log 2>&1 || true
          grep -q "Network URL\|You can now view" /tmp/st.log && echo "streamlit started" || (cat /tmp/st.log; exit 1)
