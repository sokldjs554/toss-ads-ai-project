name: live-remaining

# 사용자의 후속 작업·유료 호출 승인에 따른 추가 평가. 구현자가 별도 $4 한도를 정했다.
# 이전 $10 예약 장부는 보존하며, 실제 청구가 작아도 그 예약을 재사용하지 않는다.
on:
  workflow_dispatch:
  push:
    branches: [codex/finish-ads-remaining-20261021]
    paths: [evals/live_request_20261021.json]

permissions:
  contents: write

concurrency:
  group: preflight-paid-feature-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Frozen inputs, budget and supplemental path checks (no provider calls)
        run: |
          python -m pytest -q tests/test_live_eval_guard.py tests/test_live_features.py tests/test_live_reservation.py tests/test_remaining_reservation.py tests/test_remaining_evaluation_review.py tests/test_conv_known_gaps.py tests/test_quality_judge.py tests/test_quality_live_adapter.py tests/test_live_rewrite.py tests/test_live_conversation_followup.py
          python -m evals.live_features --request evals/live_request_20261021.json --validate-only
      - name: Persist one-time reservation before exposing API keys
        env:
          EVALUATED_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$EVALUATED_BRANCH"
          python -m scripts.claim_remaining_evaluation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/reports/live_features/reservations_remaining_20261021.json
          git commit -m "eval: reserve bounded additional measurement before provider calls"
          git push origin "HEAD:refs/heads/$EVALUATED_BRANCH"
      - name: Real model evaluation under the reserved cap
        id: measure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREFLIGHT_FORCE_DEMO: "0"
        run: python -m evals.live_features --request evals/live_request_20261021.json
      - name: Retain complete or incomplete measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-feature-measurement-${{ github.run_id }}
          path: evals/reports/live_features/*.json
          if-no-files-found: warn
      - name: Commit measured results to the evaluated branch
        if: always()
        env:
          EVALUATED_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/reports/live_features/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "eval: preserve bounded follow-up measurement (run ${{ github.run_id }})"
          git push origin "HEAD:refs/heads/$EVALUATED_BRANCH"
