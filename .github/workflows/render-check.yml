# Render 공개 서버가 살아 있고 '이 저장소의 현재 화면' 을 서빙하는지 확인한다 (수동 실행).
# 무료 인스턴스는 잠들어 있으면 깨는 데 1~2분 걸리므로 재시도한다. 화면 확인은 헤드리스 브라우저로 첫 화면 문구를 읽는다.
name: render-check

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Render 서비스 주소"
        required: false
        default: "https://preflight-toss-ads.onrender.com"
      expect:
        description: "첫 화면에 있어야 하는 문구"
        required: false
        default: "광고 검사"
      build:
        description: "배포된 빌드가 이 커밋이어야 한다 (커밋 해시 앞 7자 이상, 비우면 확인하지 않음). 화면 맨 위의 '빌드 <해시>' 표시와 비교한다"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: health
        env:
          URL: ${{ inputs.url }}
        run: |
          set -u
          base="${URL%/}"
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health -m 30 -w "%{http_code}" "$base/_stcore/health" || true)
            echo "try $i: /_stcore/health -> $code $(head -c 40 /tmp/health 2>/dev/null)"
            if [ "$code" = "200" ]; then echo "RESULT: OK $base"; exit 0; fi
            sleep 10
          done
          echo "RESULT: FAIL $base"; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 첫 화면 문구 확인 (헤드리스 브라우저)
        env:
          URL: ${{ inputs.url }}
          EXPECT: ${{ inputs.expect }}
          BUILD: ${{ inputs.build }}
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium
          python - <<'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright
          url, expect = os.environ["URL"].rstrip("/"), os.environ["EXPECT"]
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1280, "height": 900})
              pg.goto(url, wait_until="load", timeout=120_000)
              pg.get_by_text(expect, exact=False).first.wait_for(timeout=180_000)
              body = pg.inner_text("body")
              print("TITLE:", pg.title())
              print("FOUND:", expect in body)
              foot = [l for l in body.splitlines() if "개인 프로젝트" in l]
              print("FOOTER:", foot[:1])
              print("EXCEPTIONS:", pg.locator('[data-testid="stException"]').count())
              pg.screenshot(path="render_home.png")
              ok = expect in body and pg.locator('[data-testid="stException"]').count() == 0
              build = os.environ.get("BUILD", "").strip()
              if build:
                  want = "빌드 " + build[:7]
                  print("BUILD EXPECTED:", want, "| FOUND:", want in body)
                  ok = ok and want in body
              # 핵심 흐름: 예시로 바로 실행 → 결과(수정할 문구) 가 나오는지
              pg.get_by_role("button", name="예시로 바로 실행").click(timeout=60_000)
              pg.get_by_text("수정할 문구", exact=False).first.wait_for(timeout=180_000)
              body2 = pg.inner_text("body")
              flow = all(x in body2 for x in ("광고안 1", "수정할 문구", "다음 작업", "예시 실행 · 실제 AI 호출 없음"))
              print("FLOW:", flow, "| EXCEPTIONS:", pg.locator('[data-testid="stException"]').count())
              pg.screenshot(path="render_flow.png")
              ok = ok and flow and pg.locator('[data-testid="stException"]').count() == 0
              b.close()
              print("RESULT:", "OK" if ok else "FAIL")
              sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: render-home
          path: |
            render_home.png
            render_flow.png
