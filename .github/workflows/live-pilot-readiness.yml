name: live-pilot-readiness
on:
  push:
    branches: [feat/live-rag-tools-20261023]
    paths: [.github/workflows/live-pilot-readiness.yml]
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Report bindings only, never credential values
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import os, hashlib, hmac, json
          key = os.environ.get('OPENAI_API_KEY', '')
          # Domain-separated opaque app credential; the provider key never enters the browser.
          token = hmac.new(key.encode(), b'preflight-live-pilot-20261023-automation-v1', hashlib.sha256).hexdigest() if key else ''
          other = hmac.new(key.encode(), b'preflight-live-pilot-20261023-secondary-v1', hashlib.sha256).hexdigest() if key else ''
          print(json.dumps({'openai_registered': bool(key), 'render_api_registered': bool(os.environ.get('RENDER_API_KEY')), 'automation_token_sha256': hashlib.sha256(token.encode()).hexdigest() if token else None, 'secondary_token_sha256': hashlib.sha256(other.encode()).hexdigest() if other else None}))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0
      - name: Read public LIVE configuration without login or model calls
        run: |
          python - <<'PY'
          import json, shutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome'),headless=True)
              page=browser.new_page()
              page.goto('https://preflight-toss-ads.onrender.com/?view=LIVE%20검토',wait_until='domcontentloaded',timeout=90000)
              page.get_by_role('heading',name='LIVE 검토',exact=True).wait_for(timeout=180000)
              page.wait_for_timeout(3000)
              print(json.dumps({'alerts':page.locator('[data-testid="stAlert"]').all_text_contents(),'labels':page.locator('label').all_text_contents(),'visible_build':page.locator('.pf-topbar').inner_text()},ensure_ascii=False))
              browser.close()
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39958312582
          name: normalization-public-ui-39958312582-1
          path: previous-free-browser
      - name: Read previous synthetic free-browser failure
        run: |
          python - <<'PY'
          from pathlib import Path
          print(Path('previous-free-browser/server-failure.txt').read_text())
          PY
