name: live-features

# 2026-10-20 사용자 승인: 기존 GitHub Secrets 사용, 실제 유료 API 평가.
# 일반 CI/PR/Pages 배포에서는 유료 요청을 실행하지 않는다.
# 한 작업 브랜치의 명시적 요청 manifest 변경만 실행한다. 결과 커밋은 재실행하지 않는다.
on:
  workflow_dispatch:
  push:
    branches: [codex/close-ads-gaps-20261020]
    paths: [evals/live_request_20261020.json]

permissions:
  contents: write

concurrency:
  group: preflight-paid-feature-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Frozen input and budget guard checks (no network)
        run: |
          python -m pytest -q tests/test_live_eval_guard.py tests/test_live_features.py tests/test_live_reservation.py tests/test_conv_known_gaps.py
          python -m evals.live_features --request evals/live_request_20261020.json --validate-only
      - name: Persist one-time reservation before exposing API keys
        env:
          EVALUATED_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$EVALUATED_BRANCH"
          python scripts/claim_live_evaluation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/reports/live_features/reservations.json
          git commit -m "eval: reserve authorized run budget before provider calls"
          git push origin "HEAD:refs/heads/$EVALUATED_BRANCH"
      - name: Real model evaluation with pre-reserved budget
        id: measure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREFLIGHT_FORCE_DEMO: "0"
        run: python -m evals.live_features --request evals/live_request_20261020.json
      - name: Retain complete or incomplete measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-feature-measurement-${{ github.run_id }}
          path: evals/reports/live_features/*.json
          if-no-files-found: warn
      - name: Commit measured results to the evaluated branch
        if: always()
        env:
          EVALUATED_BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -d evals/reports/live_features ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/reports/live_features/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "eval: preserve bounded real-feature measurement (run ${{ github.run_id }})"
          git push origin "HEAD:refs/heads/$EVALUATED_BRANCH"
