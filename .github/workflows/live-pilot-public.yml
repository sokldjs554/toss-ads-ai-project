name: live-pilot-public
on:
  push:
    branches: [feat/live-rag-tools-20261023]
    paths: [evals/live_pilot_release.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: preflight-live-pilot-public
  cancel-in-progress: false
jobs:
  deployed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0
      - name: Install pinned Korean font for legible real browser captures
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf' --output "$HOME/.local/share/fonts/NotoSansCJKkr-Regular.otf"
          fc-cache -f
      - name: Real authenticated server workflow or read-only redeploy verification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          PREFLIGHT_BROWSER_CHANNEL: chrome
        run: |
          python - <<'PY'
          import json,subprocess
          release=json.load(open('evals/live_pilot_release.json'))
          args=['python','scripts/verify_live_pilot_ui.py','--expected-sha',release['expected_sha'],'--out','live-pilot-evidence']
          if release['verify_only']: args.append('--verify-only')
          if release.get('passage_v3'): args.append('--passage-v3')
          if release.get('secondary_account'): args.append('--secondary-account')
          if release.get('expected_prompt'): args.extend(['--expected-prompt', release['expected_prompt']])
          subprocess.run(args,check=True)
          PY
      - name: Free public regression on the same deployed build
        if: always()
        env:
          PREFLIGHT_BROWSER_CHANNEL: chrome
          OPENAI_API_KEY: ''
        run: |
          python - <<'PY'
          import json,subprocess
          release=json.load(open('evals/live_pilot_release.json'))
          subprocess.run(['python','scripts/verify_normalization_ui.py','--expected-sha',release['expected_sha'],'--out','live-pilot-evidence/free-current'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pilot-public-${{ github.run_id }}
          path: live-pilot-evidence/
          retention-days: 30
      - name: Preserve redacted synthetic evidence on the work branch
        if: always()
        env:
          EVIDENCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -f live-pilot-evidence/result.json ]; then exit 0; fi
          target="docs/evidence/live-pilot-20261023/public-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          mkdir -p "$target"
          cp live-pilot-evidence/*.json "$target/"
          for file in live-pilot-evidence/*.png live-pilot-evidence/*.txt; do
            if [ -f "$file" ]; then cp "$file" "$target/"; fi
          done
          if [ -d live-pilot-evidence/free-current ]; then cp -R live-pilot-evidence/free-current "$target/"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: preserve isolated live browser run ${{ github.run_id }}"
          git pull --rebase origin "$EVIDENCE_BRANCH"
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
